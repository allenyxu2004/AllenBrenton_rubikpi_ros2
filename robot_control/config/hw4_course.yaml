# Example layout. Replace positions and robot dimensions with your measurements.
# Origin at the lower-left corner in your top-down sketch. +x right, +y up.
# All lengths in metres. Heading is counterclockwise from +x, in degrees.
bounds_m: [0.0, 0.0, 3.048, 3.048]
start_xy_heading_deg: [2.25, 0.80, 100.0]
goal_m: [0.85, 2.20]
# Each axis-aligned obstacle is [xmin, ymin, xmax, ymax].
obstacles_m:
  - [1.27, 1.27, 1.78, 1.78]

# Measure each tag center projected onto the floor. Use unique 36h11 IDs.
# Aim perimeter tags into the course. Add obstacle-mounted tags if needed.
tag_size_m: 0.1524
landmarks_m:
  0: [0.0, 0.80]
  1: [0.0, 2.20]
  2: [0.80, 3.048]
  3: [2.20, 3.048]
  4: [3.048, 2.20]
  5: [3.048, 0.80]
  6: [2.20, 0.0]
  7: [0.80, 0.0]

resolution_m: 0.05
# Radius of the smallest circle centered on the pivot that encloses the robot.
robot_radius_m: 0.15
margin_m: 0.08
waypoint_tolerance_m: 0.05
