# HW3-calibrated pulse/settle/observe settings; HW4 skips grazing tag views.
hw4_navigation:
  ros__parameters:
    forward_left: 0.25
    forward_right: 0.20
    forward_speed_mps: 0.219070
    left_left: -0.45
    left_right: 0.30
    left_rate_rps: 2.117690
    right_left: 0.45
    right_right: -0.30
    right_rate_rps: 1.969739
    settle_s: 0.35
    observe_s: 0.25
    min_pulse_s: 0.05
    max_pulse_s: 0.15
    max_position_std_m: 0.60
    max_heading_std_rad: 0.80
    planning_timeout_s: 15.0
    max_tag_incidence_deg: 75.0  # Ignore edge-on detections; keep using other tags.
